# CI: validação do Terraform em qualquer branch; ao final abre PR para sandbox
# Runners: standard GitHub-hosted (free, unlimited para repositórios públicos)
name: CI

on:
  push:
    branches: [feature/**]
  pull_request:
    branches: [feature/**]

env:
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

  open-pr-sandbox:
    name: Abrir PR para sandbox
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' && github.ref != 'refs/heads/sandbox'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Abrir PR para sandbox
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING=$(gh pr list --base sandbox --head "$BRANCH" --json number -q 'length')
          if [ "$EXISTING" -eq 0 ]; then
            gh pr create --base sandbox --head "$BRANCH" \
              --title "Merge $BRANCH → sandbox" \
              --body "CI passou. Aprove e faça merge para disparar o deploy (CD) em sandbox."
          else
            echo "PR de $BRANCH para sandbox já existe."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
