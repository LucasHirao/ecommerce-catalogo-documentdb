# CD: deploy da infraestrutura na AWS (credenciais via GitHub Secrets)
# Conta sandbox: atualize os secrets antes de rodar o deploy.
name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente (sandbox, dev, prod)"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
          - dev
          - prod
  push:
    branches: [sandbox]
    paths:
      - 'terraform/**'
      - '.github/workflows/cd.yml'

env:
  TF_WORKING_DIR: terraform

jobs:
  deploy:
    name: Terraform apply
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'sandbox' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform init
        run: |
          BUCKET="$(aws sts get-caller-identity --query Account --output text)-stage-terraform"
          terraform init -input=false -backend-config="bucket=$BUCKET"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'sandbox' }}
          TF_VAR_documentdb_username: ${{ secrets.DOCUMENTDB_USERNAME }}
          TF_VAR_documentdb_password: ${{ secrets.DOCUMENTDB_PASSWORD }}
          TF_VAR_use_existing_vpc: ${{ secrets.TF_VAR_use_existing_vpc || 'false' }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_vpc_id || '' }}
          TF_VAR_subnet_ids: ${{ secrets.TF_VAR_subnet_ids || '[]' }}

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'sandbox' }}
          TF_VAR_documentdb_username: ${{ secrets.DOCUMENTDB_USERNAME }}
          TF_VAR_documentdb_password: ${{ secrets.DOCUMENTDB_PASSWORD }}
          TF_VAR_use_existing_vpc: ${{ secrets.TF_VAR_use_existing_vpc || 'false' }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_vpc_id || '' }}
          TF_VAR_subnet_ids: ${{ secrets.TF_VAR_subnet_ids || '[]' }}

      - name: Outputs
        run: terraform output -json
        working-directory: ${{ env.TF_WORKING_DIR }}
        if: success()
